# Site Analyzer - Fly.io
# https://fly.io/docs/reference/configuration/

# Имя приложения — замените на уникальное при fly launch
app = "site-analyzer"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 100

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/"
    timeout = "10s"

[vm]
  size = "shared-cpu-2x"
  memory = "1gb"

kill_signal = "SIGTERM"
kill_timeout = 120
