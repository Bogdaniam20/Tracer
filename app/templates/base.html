<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Site Analyzer{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="nav-logo">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/>
                    <line x1="2" y1="12" x2="22" y2="12"/>
                    <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
                </svg>
                <span>Site Analyzer</span>
            </a>
            <div class="nav-links">
                <a href="/" class="nav-link {% block nav_active_analyze %}{% endblock %}">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                    </svg>
                    Анализ
                </a>
                <a href="/saved" class="nav-link {% block nav_active_saved %}{% endblock %}">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
                    </svg>
                    Сохранённые
                    <span class="nav-badge" id="saved-count" style="display:none"></span>
                </a>
            </div>
        </div>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}

        <footer>
            <p>&copy; 2026 Site Analyzer. BSUIR Students.</p>
        </footer>
    </div>

    {% block scripts %}{% endblock %}

    <script>
        fetch('/api/saved').then(r => r.json()).then(data => {
            const badge = document.getElementById('saved-count');
            if (data.length > 0) {
                badge.textContent = data.length;
                badge.style.display = '';
            }
        }).catch(() => {});
    </script>
</body>
</html>
