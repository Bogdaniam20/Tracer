<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Site Analyzer{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="nav-logo">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/>
                    <line x1="2" y1="12" x2="22" y2="12"/>
                    <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
                </svg>
                <span>Site Analyzer</span>
            </a>
            <div class="nav-links">
                <a href="/" class="nav-link {% block nav_active_analyze %}{% endblock %}">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                    </svg>
                    {{ t.nav_analysis }}
                </a>
                <a href="/saved" class="nav-link {% block nav_active_saved %}{% endblock %}">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
                    </svg>
                    {{ t.nav_saved }}
                    <span class="nav-badge" id="saved-count" style="display:none"></span>
                </a>
                <a href="/history" class="nav-link {% block nav_active_history %}{% endblock %}">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
                    </svg>
                    {{ t.nav_history }}
                </a>
                <div class="lang-selector">
                    <span class="lang-label">{{ t.lang_label }}:</span>
                    <a href="/api/set-lang?lang=ru" class="lang-btn {% if lang == 'ru' %}active{% endif %}" title="Русский">RU</a>
                    <a href="/api/set-lang?lang=en" class="lang-btn {% if lang == 'en' %}active{% endif %}" title="English">EN</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}

        <footer>
            <p>{{ t.footer }}</p>
        </footer>
    </div>

    <script>
        window.__t = {{ t_js | tojson | safe }};
    </script>
    {% block scripts %}{% endblock %}
    <script>
        fetch('/api/saved').then(r => r.json()).then(data => {
            const badge = document.getElementById('saved-count');
            if (data.length > 0) {
                badge.textContent = data.length;
                badge.style.display = '';
            }
        }).catch(() => {});
    </script>
</body>
</html>
