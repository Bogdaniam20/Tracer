{% extends "base.html" %}

{% block title %}{{ t.title_history }}{% endblock %}
{% block nav_active_history %}active{% endblock %}

{% block content %}
<header>
    <h1 class="page-title">{{ t.page_history }}</h1>
    <p class="subtitle">{{ t.subtitle_history }}</p>
</header>

<main>
    <div id="history-toolbar" class="history-toolbar hidden">
        <button id="clear-history-btn" class="btn-clear-history">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
            </svg>
            {{ t.btn_clear_history }}
        </button>
    </div>

    <div id="history-empty" class="empty-state-block hidden">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
        </svg>
        <p>{{ t.empty_history }}</p>
        <a href="/" class="btn-link">{{ t.btn_analyze_now }}</a>
    </div>

    <div id="history-list" class="saved-list"></div>
</main>
{% endblock %}

{% block scripts %}
<script src="/static/js/history.js"></script>
{% endblock %}
